<svg width="720" height="340" xmlns="http://www.w3.org/2000/svg" style="background:#1e1e2e; font-family:sans-serif; border-radius:8px;">
<text x="360" y="28" fill="#cdd6f4" font-size="16" font-weight="bold" text-anchor="middle">PCIe 3.0 Transfer Bandwidth: Pinned vs Pageable RAM</text>
<line x1="80" y1="50" x2="80" y2="280" stroke="#45475a" stroke-width="2"/>
<line x1="80" y1="280" x2="680" y2="280" stroke="#45475a" stroke-width="2"/>
